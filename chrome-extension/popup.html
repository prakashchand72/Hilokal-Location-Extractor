<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hilokal Locations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-width: 300px;
      max-width: 420px;
      background: #fff;
      color: #111;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #e5e5e5;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    #count { font-size: 12px; color: #888; }

    /* Seat request bar */
    #seat-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #f8f8f8;
    }
    #call-id-label { font-size: 12px; color: #666; flex: 1; }
    #call-id-label span { font-weight: 600; color: #333; }
    #btn-seat {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid #4285f4;
      border-radius: 4px;
      background: #4285f4;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #btn-seat:hover { background: #3367d6; border-color: #3367d6; }
    #btn-seat:disabled { background: #aaa; border-color: #aaa; cursor: default; }
    #burst-bar {
      display: flex;
      gap: 6px;
      padding: 6px 14px 8px;
      background: #f8f8f8;
      border-bottom: 1px solid #e5e5e5;
    }
    .btn-burst {
      flex: 1;
      font-size: 12px;
      padding: 4px 0;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #333;
    }
    .btn-burst:hover { background: #e8f0fe; border-color: #4285f4; color: #4285f4; }
    .btn-burst:disabled { opacity: 0.5; cursor: default; }
    #seat-status {
      font-size: 11px;
      padding: 4px 14px 0;
      min-height: 16px;
    }
    #seat-status.ok  { color: #2a9d2a; }
    #seat-status.err { color: #c00; }

    /* Birthday bar */
    #birthday-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }
    #birthday-bar label { font-size: 12px; color: #666; flex-shrink: 0; }
    #bday-input {
      flex: 1;
      font-size: 12px;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      outline: none;
      min-width: 0;
    }
    #bday-input:focus { border-color: #4285f4; }
    .btn-bday {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #btn-bday-set    { background: #4285f4; color: #fff; border: 1px solid #4285f4; }
    #btn-bday-set:hover    { background: #3367d6; border-color: #3367d6; }
    #btn-bday-remove { background: #fff; color: #c00; border: 1px solid #c00; }
    #btn-bday-remove:hover { background: #fff0f0; }
    #bday-flicker-bar {
      padding: 6px 14px 8px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
    }
    #btn-bday-flicker {
      width: 100%;
      font-size: 12px;
      padding: 5px 0;
      border: 1px solid #f59e0b;
      border-radius: 4px;
      background: #fff;
      color: #b45309;
      cursor: pointer;
    }
    #btn-bday-flicker:hover  { background: #fffbeb; }
    #btn-bday-flicker.active { background: #f59e0b; color: #fff; border-color: #d97706; }
    #btn-bday-flicker.active:hover { background: #d97706; border-color: #b45309; }
    #bday-status {
      font-size: 11px;
      padding: 3px 14px 4px;
      min-height: 15px;
      border-bottom: 1px solid #e5e5e5;
    }
    #bday-status.ok  { color: #2a9d2a; }
    #bday-status.err { color: #c00; }

    /* Image upload bar */
    #img-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #e5e5e5;
      background: #f0f7ff;
    }
    #img-bar label { font-size: 12px; color: #555; flex-shrink: 0; }
    #img-file { flex: 1; font-size: 11px; min-width: 0; }
    #btn-img-upload {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid #0a7c3e;
      border-radius: 4px;
      background: #0a7c3e;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #btn-img-upload:hover { background: #085c2e; border-color: #085c2e; }
    #btn-img-upload:disabled { background: #aaa; border-color: #aaa; cursor: default; }
    #img-status {
      font-size: 11px;
      padding: 3px 14px 4px;
      min-height: 15px;
      border-bottom: 1px solid #e5e5e5;
    }
    #img-status.ok  { color: #2a9d2a; }
    #img-status.err { color: #c00; }

    #list {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
    }
    #list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 14px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    #list li:last-child { border-bottom: none; }
    .name { font-weight: 500; }
    .city { color: #555; margin-left: 8px; flex-shrink: 0; }
    .time { font-size: 11px; color: #bbb; margin-left: auto; padding-left: 10px; flex-shrink: 0; }
    #search-bar {
      padding: 8px 14px;
      border-bottom: 1px solid #e5e5e5;
      display: none;
    }
    #search-bar.visible { display: block; }
    #search {
      width: 100%;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 4px;
      outline: none;
      background: #fafafa;
    }
    #search:focus { border-color: #4285f4; background: #fff; }
    #empty {
      padding: 24px 14px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
    footer {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #e5e5e5;
    }
    footer button {
      flex: 1;
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
    }
    footer button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <header>
    <h1>Hilokal Location Extractor</h1>
    <span id="count"></span>
  </header>

  <div id="seat-bar">
    <span id="call-id-label">Call ID: <span id="call-id">—</span></span>
    <button id="btn-seat">Spam</button>
  </div>
  <div id="burst-bar">
    <button class="btn-burst" data-n="1">Send ×1</button>
    <button class="btn-burst" data-n="5">Send ×5</button>
    <button class="btn-burst" data-n="10">Send ×10</button>
    <button class="btn-burst" data-n="20">Send ×20</button>
  </div>
  <div id="seat-status"></div>

  <div id="birthday-bar">
    <label for="bday-input">Birthday:</label>
    <input type="date" id="bday-input">
    <button type="button" class="btn-bday" id="btn-bday-set">Set</button>
    <button type="button" class="btn-bday" id="btn-bday-remove">Remove</button>
  </div>
  <div id="bday-flicker-bar">
    <button type="button" id="btn-bday-flicker">Flicker (Set ↔ Unset)</button>
  </div>
  <div id="bday-status"></div>

  <!-- Image upload -->
  <div id="img-bar">
    <label for="img-file">📷</label>
    <input type="file" id="img-file" accept="image/*">
    <button id="btn-img-upload">Send to Chat</button>
  </div>
  <div id="img-status"></div>

  <div id="search-bar">
    <input id="search" type="search" placeholder="Search by name…" autocomplete="off" spellcheck="false">
  </div>

  <ul id="list"></ul>
  <p id="empty"></p>

  <footer>
    <button id="btn-copy">Copy CSV</button>
    <button id="btn-clear">Clear</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
